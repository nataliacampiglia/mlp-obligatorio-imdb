[project]
name = "imdb_rating"
version = "0.1.0"
description = "Shared library for the IMDB rating prediction project (schemas, model, W&B registry)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "scikit-learn>=1.3",
    "joblib",
    "wandb",
    "numpy",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["imdb_rating*"]
