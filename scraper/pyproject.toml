[tool.poetry]
name = "mlp-obligatorio-imdb"
version = "0.1.0"
description = "IMDB scraper for rating prediction obligatorio"
authors = ["Natalia Campiglia <campiglianatalia@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.51.0"
pydantic = "^2.11.0"
pyyaml = "^6.0.2"
boto3 = "^1.34"
pyarrow = ">=18.0"
pandas = ">=2.0"
s3fs = ">=2023.0"
tabulate = ">=0.9"
vaderSentiment = "^3.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
