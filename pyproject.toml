[tool.poetry]
name = "mlp-obligatorio-imdb"
version = "0.1.0"
description = "IMDB rating prediction — scraper, training and deployment"
authors = ["Natalia Campiglia <campiglianatalia@gmail.com>"]
readme = "README.md"
packages = [{include = "imdb_rating", from = "src"}]

# ── Dependencias compartidas (siempre instaladas) ────────────────────────────
[tool.poetry.dependencies]
python     = "^3.11"
pydantic   = "^2.11.0"
boto3      = "^1.34"
numpy      = ">=1.24"
pandas     = ">=2.0"
scikit-learn = ">=1.3"
joblib     = ">=1.3"
wandb      = ">=0.16"

# ── Scraper ──────────────────────────────────────────────────────────────────
[tool.poetry.group.scraper.dependencies]
playwright     = "^1.51.0"
pyyaml         = "^6.0.2"
pyarrow        = ">=18.0"
s3fs           = ">=2023.0"
tabulate       = ">=0.9"
vaderSentiment = "^3.3.2"

# ── Deployment ───────────────────────────────────────────────────────────────
[tool.poetry.group.deployment.dependencies]
fastapi  = ">=0.110"
uvicorn  = {extras = ["standard"], version = ">=0.27"}
requests = ">=2.31"
vaderSentiment = "^3.3.2"

# ── Monitoring (Streamlit dashboard) ─────────────────────────────────────────
[tool.poetry.group.monitoring.dependencies]
streamlit = ">=1.30"
plotly    = ">=5.18"
requests  = ">=2.31"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
